kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: maintenance-site
  namespace: 0198bb-tools
spec:
  output:
    to:
      kind: ImageStreamTag
      name: 'maintenance-site:latest'
  resources: {}
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  postCommit: {}
  source:
    type: Git
    git:
      uri: 'https://github.com/bcgov/jag-traffic-courts-online'
      ref: feature/TCVP-2825
    contextDir: infrastructure/static-site/maintenance
  runPolicy: Serial
