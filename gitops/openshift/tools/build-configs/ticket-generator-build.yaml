kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: ticket-generator-build
  namespace: 0198bb-tools
spec:
  output:
    to:
      kind: ImageStreamTag
      name: 'ticket-gen:latest'
  resources: {}
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  postCommit: {}
  source:
    type: Git
    git:
      uri: 'https://github.com/bcgov/jag-traffic-courts-online'
      ref: develop
    contextDir: tools/ticket-generator
  runPolicy: Serial
