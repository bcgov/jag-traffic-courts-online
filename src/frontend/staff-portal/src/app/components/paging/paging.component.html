<nav aria-label="Page navigation">
  <ul class="pagination mb-0">
    <li class="page-item" [class.disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">
      <a class="page-link" href="javascript:void(0)" aria-label="Previous">
        <span aria-hidden="true">&laquo;</span>
      </a>
    </li>
    @for (in of counter(totalPages); track i; let i = $index) {
      @if (showPage(i+1)) {
        <li class="page-item" [class.active]="i+1 === currentPage" (click)="changePage(i+1)">
          <a class="page-link" href="javascript:void(0)">{{i+1}}</a>
        </li>
      }
    }
    <li class="page-item" [class.disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">
      <a class="page-link" href="javascript:void(0)" aria-label="Next">
        <span aria-hidden="true">&raquo;</span>
      </a>
    </li>
    <li>
      <div class="page-info">&nbsp;Page <span> {{currentPage}} </span> of <span> {{totalPages}} </span></div>
    </li>
  </ul>
</nav>
