@if (busy && !busy.closed) {
  <div #ref
    class="busy-loading alert alert-primary"
    [ngClass]="getTextAlignment()">
    <ng-content></ng-content>
    <div>
      {{ loadingMessage }}
    </div>
  </div>
  @if (ref.children.length === 0) {
    <span
      [ngClass]="getTextAlignment()">
      {{ loadingMessage }}
    </span>
  }
}
