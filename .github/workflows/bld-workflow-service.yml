name: Build Workflow Service

# This workflow will automatically build the workflow-service project on the creation of a tag in Github.
# The build is then pushed to Openshift, tagged with the gitsha and the release tag, ie. workflow-service:5adf53, workflow-service:1.2.3

on:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Release Version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Login to OpenShift
        uses: docker/login-action@v1
        with:
          registry: ${{secrets.OPENSHIFT_EXTERNAL_REPOSITORY}}
          username: ${{secrets.OPENSHIFT_SA_USERNAME}}
          password: ${{secrets.OPENSHIFT_SA_PASSWORD}}

      - name: Build and push
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1
          CONTEXT: ./src/backend/TrafficCourts
          DOCKERFILE: ./src/backend/TrafficCourts/Workflow.Service/Dockerfile.rhel8
          IMAGE: ${{secrets.OPENSHIFT_EXTERNAL_REPOSITORY}}/${{secrets.OPENSHIFT_TOOLS_NAMESPACE}}/workflow-service
        run: |
          git_sha=$(git rev-parse --short HEAD)
          commit_sha=$(git rev-parse HEAD)
          commit_date=$(git log -1 --format=%cd --date=iso)
          build_uid=$(cat /proc/sys/kernel/random/uuid | tr -d '-' | cut -c1-8)

          echo "Building workflow-service:${git_sha}-${build_uid}"

          docker build \
            --build-arg GIT_COMMIT_DATE=${commit_date} \
            --build-arg GIT_SHA=${commit_sha} \
            --build-arg GIT_SHORT_SHA=${git_sha} \
            --build-arg GIT_VERSION=${GITHUB_REF#refs/*/} \
            --tag ${IMAGE}:${git_sha}-${build_uid} \
            -f ${DOCKERFILE} \
            ${CONTEXT}

          # Always push with the unique build tag
          docker push ${IMAGE}:${git_sha}-${build_uid}

          # Tag as latest (equivalent to Tekton oc-tag-push on eventtype=push)
          docker tag ${IMAGE}:${git_sha}-${build_uid} ${IMAGE}:latest
          docker push ${IMAGE}:latest

          # If triggered by a tag, also tag with the release version (equivalent to Tekton oc-tag-release)
          if [ -n "${RELEASE_VERSION}" ] && [ "${RELEASE_VERSION}" != "${git_sha}" ]; then
            docker tag ${IMAGE}:${git_sha}-${build_uid} ${IMAGE}:${RELEASE_VERSION}
            docker push ${IMAGE}:${RELEASE_VERSION}
            echo "Tagged: workflow-service:${RELEASE_VERSION}"
          fi
